<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%">
  <defs>
    <filter id="wiproGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="320" height="140" rx="14" fill="#FFFFFF"/>
  
  <!-- Wipro Multi-Color Radial Dots Emblem -->
  <g transform="translate(68, 70)" filter="url(#wiproGlow)">
    <!-- Central ring of vibrant colored dots -->
    <circle cx="0" cy="-22" r="6" fill="#00838F"/>
    <circle cx="15" cy="-16" r="6" fill="#00ACC1"/>
    <circle cx="22" cy="0" r="6" fill="#43A047"/>
    <circle cx="16" cy="16" r="6" fill="#7CB342"/>
    <circle cx="0" cy="22" r="6" fill="#FDD835"/>
    <circle cx="-16" cy="16" r="6" fill="#FB8C00"/>
    <circle cx="-22" cy="0" r="6" fill="#E53935"/>
    <circle cx="-15" cy="-16" r="6" fill="#8E24AA"/>
    <circle cx="0" cy="0" r="7" fill="#1E88E5"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(120, 62)">
    <text font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#2E3842" letter-spacing="-0.5">
      wipro
    </text>
    <text y="24" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#00838F" letter-spacing="2">
      LIGHTING &amp; ELECTRICALS
    </text>
    <text y="40" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#78909C" letter-spacing="1">
      ★ SMART LED SOLUTIONS ★
    </text>
  </g>
</svg>
