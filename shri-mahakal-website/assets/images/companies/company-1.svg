<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%">
  <defs>
    <linearGradient id="nandiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B2A5B" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="320" height="140" rx="14" fill="#FFFFFF"/>
  
  <!-- Cable Coil / Shield Emblem -->
  <g transform="translate(24, 25)">
    <circle cx="45" cy="45" r="38" fill="url(#nandiGrad)" filter="url(#softShadow)"/>
    <circle cx="45" cy="45" r="28" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="45" cy="45" r="20" fill="url(#copperGrad)"/>
    <circle cx="45" cy="45" r="10" fill="#FFFFFF"/>
    <!-- Lightning bolt inside -->
    <path d="M47 38 L42 46 L46 46 L43 54 L50 44 L46 44 Z" fill="#D32F2F"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(122, 54)">
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#0B2A5B" letter-spacing="1">
      NANDI<tspan fill="#D32F2F">CAB</tspan>
    </text>
    <text y="24" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6F00" letter-spacing="2.5">
      WIRES &amp; CABLES
    </text>
    <text y="40" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#78909C" letter-spacing="1">
      ★ 100% PURE COPPER ★
    </text>
  </g>
</svg>
